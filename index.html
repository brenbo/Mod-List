        }

        h1 {
            font-size: 24px;
            text-align: center;
            text-shadow: 3px 3px 0px var(--mc-shadow);
            margin-bottom: 25px;
            letter-spacing: 1px;
        }

        .server-container {
            width: 100%;
            max-width: 700px;
            background-color: rgba(0, 0, 0, 0.4);
            border: 4px solid var(--mc-dark-gray);
            padding: 4px;
            margin-bottom: 20px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
        }

        .mod-row {
            display: flex;
            align-items: center;
            padding: 12px;
            border: 2px solid transparent;
            cursor: pointer;
            position: relative;
            background-color: rgba(0, 0, 0, 0.2);
            margin-bottom: 4px;
        }

        .mod-row:last-child {
            margin-bottom: 0;
        }

        .mod-row:hover {
            border: 2px solid #808080;
            background-color: rgba(255, 255, 255, 0.05);
        }

        .mod-icon {
            width: 48px;
            height: 48px;
            image-rendering: pixelated;
            margin-right: 16px;
            flex-shrink: 0;
            background-color: rgba(0,0,0,0.3);
            border: 2px solid #333;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .mod-icon svg {
            width: 32px;
            height: 32px;
            fill: #fff;
        }

        .mod-details {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .mod-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
        }

        .mod-name {
            font-size: 16px;
            text-shadow: 2px 2px 0px var(--mc-shadow);
        }

        .mod-version {
            color: var(--mc-yellow);
            font-size: 12px;
            text-shadow: 1px 1px 0px var(--mc-shadow);
        }

        .mod-motd {
            color: var(--mc-gray);
            font-size: 12px;
            text-shadow: 1px 1px 0px var(--mc-shadow);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 450px;
        }

        .status-container {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-left: 12px;
        }

        .ping-bars {
            display: flex;
            align-items: flex-end;
            gap: 2px;
            width: 20px;
            height: 16px;
        }

        .ping-bar {
            width: 2px;
            background-color: var(--mc-dark-gray);
        }
        .ping-bar:nth-child(1) { height: 20%; }
        .ping-bar:nth-child(2) { height: 40%; }
        .ping-bar:nth-child(3) { height: 60%; }
        .ping-bar:nth-child(4) { height: 80%; }
        .ping-bar:nth-child(5) { height: 100%; }

        .online .ping-bar {
            background-color: var(--mc-green);
        }
        
        .offline .ping-bar {
            background-color: var(--mc-red);
            height: 100% !important;
            width: 2px;
        }
        .offline .ping-bar:not(:nth-child(3)) {
            background-color: transparent;
        }

        .btn-download {
            background-color: rgba(0,0,0,0.4);
            border: 2px solid var(--mc-green);
            color: var(--mc-green);
            font-family: 'Minecraftia', sans-serif;
            font-size: 10px;
            padding: 4px 8px;
            cursor: pointer;
            text-shadow: 1px 1px 0px #002200;
        }
        .btn-download:hover {
            background-color: var(--mc-green);
            color: black;
            text-shadow: none;
        }

        .action-bar {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            max-width: 400px;
            margin-top: 10px;
        }

        .mc-btn {
            position: relative;
            width: 100%;
            height: 40px;
            background: #4a4a4a border-box;
            border: 2px solid #000;
            box-shadow: inset -2px -2px 0px #212121, inset 2px 2px 0px #8a8a8a;
            color: #e0e0e0;
            font-family: 'Minecraftia', sans-serif;
            font-size: 14px;
            text-align: center;
            line-height: 36px;
            cursor: pointer;
            text-shadow: 2px 2px 0px #212121;
        }

        .mc-btn:hover {
            background: #6b6b6b;
            color: #fffb7d;
            box-shadow: inset -2px -2px 0px #313131, inset 2px 2px 0px #a3a3a3;
        }

        .mc-btn:active {
            box-shadow: inset 2px 2px 0px #212121, inset -2px -2px 0px #8a8a8a;
            line-height: 38px;
        }
    </style>
</head>
