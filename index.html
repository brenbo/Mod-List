        /* Header UI Overlay */
        .header {
            background: rgba(0, 0, 0, 0.8);
            border-bottom: 4px solid #3c3c3c;
            text-align: center;
            padding: 20px;
            color: #FFFFFF;
            font-size: 18px;
            text-shadow: 2px 2px #000000;
        }

        /* Footer UI Overlay */
        .footer {
            background: rgba(0, 0, 0, 0.8);
            border-top: 4px solid #3c3c3c;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        /* Mod List Scroll Window Container */
        .server-list-container {
            flex: 1;
            overflow-y: auto;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            padding: 10px 20px;
        }

        .server-list-container::-webkit-scrollbar {
            width: 12px;
        }
        .server-list-container::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.5);
        }
        .server-list-container::-webkit-scrollbar-thumb {
            background: #8B8B8B;
            border: 2px solid #3C3C3C;
        }

        /* Mod Selection Rows */
        .mod-row {
            display: flex;
            align-items: center;
            padding: 8px;
            margin-bottom: 8px;
            border: 2px solid transparent;
            background: rgba(0, 0, 0, 0.4);
            cursor: pointer;
            position: relative;
        }

        .mod-row:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .mod-row.selected {
            border: 2px solid #FFFFFF;
            background: rgba(255, 255, 255, 0.1);
        }

        /* Graphic Image Asset Blocks */
        .mod-icon {
            width: 48px;
            height: 48px;
            image-rendering: pixelated;
            margin-right: 15px;
            border: 2px solid #3c3c3c;
            background: #111111;
            flex-shrink: 0;
        }
        .mod-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Text Data Layouts */
        .mod-details {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .mod-title {
            color: #FFFF55;
            font-size: 14px;
            text-shadow: 2px 2px #000000;
            margin-bottom: 2px;
        }

        .mod-desc {
            color: #AAAAAA;
            font-size: 11px;
            text-shadow: 1px 1px #000000;
            line-height: 1.4;
        }

        /* Signal Pings */
        .status-container {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            justify-content: center;
            margin-left: 15px;
            min-width: 80px;
        }

        .version-tag {
            color: #55FF55;
            font-size: 11px;
            text-shadow: 1px 1px #000000;
            margin-bottom: 4px;
        }

        .signal-bars {
            display: flex;
            align-items: flex-end;
            gap: 2px;
            width: 18px;
            height: 14px;
        }
        .bar {
            width: 2px;
            background-color: #55FF55;
            box-shadow: 1px 1px #000000;
        }
        .bar-1 { height: 20%; }
        .bar-2 { height: 40%; }
        .bar-3 { height: 60%; }
        .bar-4 { height: 80%; }
        .bar-5 { height: 100%; }

        /* Action Selection Buttons */
        .button-row {
            display: flex;
            gap: 10px;
            width: 100%;
            max-width: 600px;
            justify-content: center;
        }

        .mc-btn {
            flex: 1;
            height: 40px;
            background: #5c5c5c;
            border: 2px solid #000000;
            box-shadow: inset -2px -2px #3a3a3a, inset 2px 2px #aeaeae;
            color: #E0E0E0;
            font-family: 'Minecraftia', sans-serif;
            font-size: 12px;
            text-shadow: 2px 2px #000000;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .mc-btn:hover:not(.disabled) {
            background: #6c8c5c;
            box-shadow: inset -2px -2px #4c6c3c, inset 2px 2px #8cbc7c;
            color: #FFFFFF;
        }

        .mc-btn:active:not(.disabled) {
            box-shadow: inset 2px 2px #3a3a3a, inset -2px -2px #aeaeae;
            padding-top: 2px;
        }

        .mc-btn.disabled {
            background: #4a4a4a;
            box-shadow: none;
            color: #7a7a7a;
            text-shadow: none;
            cursor: not-allowed;
        }

        /* Help Modal Window Box Styles */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            z-index: 100;
            align-items: center;
            justify-content: center;
        }

        .modal-box {
            background: #2d2d2d;
            border: 4px solid #000000;
            box-shadow: inset -4px -4px #1a1a1a, inset 4px 4px #5a5a5a;
            width: 90%;
            max-width: 500px;
            padding: 20px;
            text-align: center;
        }

        .modal-title {
            color: #FFFFFF;
            font-size: 16px;
            margin-bottom: 15px;
            text-shadow: 2px 2px #000000;
        }

        .modal-content {
            color: #AAAAAA;
            font-size: 12px;
            text-align: left;
            line-height: 1.6;
            margin-bottom: 20px;
            text-shadow: 1px 1px #000000;
            max-height: 250px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .modal-content ol {
            margin: 0;
            padding-left: 20px;
        }

        .modal-content li {
            margin-bottom: 8px;
        }
