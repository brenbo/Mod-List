<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Server Mod Downloader</title>
    <style>
        /* Base Styling & Reset */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #121212;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Container Layout */
        .mod-downloader-container {
            background-color: #1e1e1e;
            border-radius: 8px;
            width: 100%;
            max-width: 650px;
            padding: 24px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        h2 {
            margin-bottom: 20px;
            color: #ffffff;
            border-bottom: 2px solid #2d2d2d;
            padding-bottom: 10px;
        }

        /* Mod List UI */
        .mod-list {
            list-style: none;
            margin-bottom: 24px;
        }

        .mod-item {
            background-color: #252525;
            border: 1px solid #333;
            border-radius: 6px;
            padding: 16px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .mod-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .mod-name {
            font-weight: bold;
            color: #ffffff;
        }

        .mod-version {
            color: #888;
            font-size: 0.9em;
            background-color: #1a1a1a;
            padding: 2px 6px;
            border-radius: 4px;
        }

        /* Online Status Badge */
        .status-indicator {
            font-size: 0.8em;
            font-weight: bold;
            text-transform: uppercase;
            padding: 2px 8px;
            border-radius: 20px;
        }

        .status-indicator.online {
            background-color: #2e7d32;
            color: #a5d6a7;
        }

        /* Action Buttons */
        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            font-weight: 6px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: background 0.2s, transform 0.1s;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-download {
            background-color: #007bff;
            color: white;
            font-size: 0.9em;
        }

        .btn-download:hover {
            background-color: #0056b3;
        }

        /* Global Control Dashboard */
        .global-actions {
            display: flex;
            gap: 12px;
            justify-content: flex-start;
            border-top: 2px solid #2d2d2d;
            padding-top: 20px;
        }

        .btn-primary {
            background-color: #28a745;
            color: white;
        }

        .btn-primary:hover {
            background-color: #218838;
        }

        .btn-secondary {
            background-color: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background-color: #5a6268;
        }

        .btn-danger {
            background-color: #dc3545;
            color: white;
        }

        .btn-danger:hover {
            background-color: #c82333;
        }
    </style>
</head>
<body>

<div class="mod-downloader-container">
    <h2>Play Multiplayer</h2>
    
    <!-- Mod Entries Dashboard -->
    <ul class="mod-list" id="mod-list-container">
        
        <!-- Iris Mod Row Configured dynamically to pull the official .exe -->
        <li class="mod-item" data-download-url="https://github.com">
            <div class="mod-info">
                <span class="mod-name">Iris Shaders</span>
                <span class="mod-version">26.3</span>
                <span class="status-indicator online">Online</span>
            </div>
            <div class="mod-actions">
                <a href="https://github.com" 
                   class="btn btn-download" 
                   download="Iris-Installer.exe">
                    Download Mod
                </a>
            </div>
        </li>

    </ul>

    <!-- Global Interface Footer Actions -->
    <div class="global-actions">
        <button id="btn-download-all" class="btn btn-primary">Download All Mods</button>
        <button id="btn-refresh" class="btn btn-secondary">Refresh List</button>
        <button id="btn-cancel" class="btn btn-danger">Cancel</button>
    </div>
</div>

<script>
    // Primary Web Interactive Control Scripts
    document.addEventListener('DOMContentLoaded', () => {
        const downloadAllBtn = document.getElementById('btn-download-all');
        const refreshBtn = document.getElementById('btn-refresh');
        const cancelBtn = document.getElementById('btn-cancel');

        // Logic to cycle and request downloads programmatically
        downloadAllBtn.addEventListener('click', () => {
            const modItems = document.querySelectorAll('.mod-item');
            
            if(modItems.length === 0) {
                alert("No mods available to download.");
                return;
            }

            modItems.forEach((item, index) => {
                const url = item.getAttribute('data-download-url');
                if (url) {
                    // Staggering trigger cycles slightly avoids modern browser batch blocks
                    setTimeout(() => {
                        const tempAnchor = document.createElement('a');
                        tempAnchor.href = url;
                        // Use runtime extraction or specific fallbacks to preserve name targets
                        tempAnchor.setAttribute('download', url.split('/').pop());
                        document.body.appendChild(tempAnchor);
                        tempAnchor.click();
                        document.body.removeChild(tempAnchor);
                    }, index * 400); 
                }
            });
        });

        // Interface System Commands Action Logic
        refreshBtn.addEventListener('click', () => {
            console.log("Refreshing mod data array...");
            // Simulated state reset
            location.reload();
        });

        cancelBtn.addEventListener('click', () => {
            alert("Download operations cancelled.");
        });
    });
</script>

</body>
</html>
