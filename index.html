<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Server Mod Downloader</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body {
            margin: 0;
            padding: 0;
            font-family: 'Minecraft', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-image: url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAEAAAABACAYAAACqaXHeAAAAP0lEQVR42u3BAQ0AAADCoPdPbQ43oAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA8DAaoAAB7pRE1AAAAABJRU5ErkJggg=='); /* 2D Pixelated Dirt Background */
            background-size: 64px 64px;
            background-repeat: repeat;
            color: #AAAAAA;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            image-rendering: pixelated;
        }
        .header {
            text-align: center;
            padding: 20px 0 10px 0;
            background: rgba(0, 0, 0, 0.4);
            border-bottom: 4px solid #3c3c3c;
        }
        .header h1 {
            color: #FFFFFF;
            font-size: 24px;
            margin: 0 0 10px 0;
            text-shadow: 3px 3px #3F3F3F;
            font-weight: normal;
        }
        .header p {
            margin: 0;
            color: #E0E0E0;
            font-size: 14px;
            text-shadow: 2px 2px #2D2D2D;
        }
        .mod-list-container {
            flex: 1;
            overflow-y: auto;
            padding: 10px 0;
            background: rgba(0, 0, 0, 0.6);
            border-bottom: 4px solid #3c3c3c;
        }
        .mod-list {
            max-width: 800px;
            margin: 0 auto;
            padding: 0 20px;
        }
        .mod-item {
            display: flex;
            align-items: center;
            padding: 10px;
            margin-bottom: 10px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid transparent;
            cursor: pointer;
            position: relative;
        }
        .mod-item:hover {
            border: 2px solid #ffffff;
            background: rgba(255, 255, 255, 0.1);
        }
        .mod-icon {
            width: 48px;
            height: 48px;
            margin-right: 15px;
            image-rendering: pixelated;
            border-radius: 4px;
            background-color: #333;
        }
        .mod-info {
            flex: 1;
        }
        .mod-title-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }
        .mod-name {
            color: #FFFFFF;
            font-size: 16px;
            text-shadow: 2px 2px #3F3F3F;
        }
        .mod-status {
            font-size: 14px;
            text-shadow: 2px 2px #2D2D2D;
        }
        .status-online {
            color: #55FF55;
        }
        .status-offline {
            color: #FF5555;
        }
        .mod-version {
            font-size: 14px;
            color: #FFAA00;
            text-shadow: 2px 2px #3F2A00;
        }
        .mod-description {
            font-size: 13px;
            color: #AAAAAA;
            text-shadow: 2px 2px #2D2D2D;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 600px;
        }
        .footer {
            background: rgba(0, 0, 0, 0.4);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }
        .downloader-status-bar {
            width: 100%;
            max-width: 600px;
            height: 24px;
            background: #000000;
            border: 2px solid #555555;
            position: relative;
            display: none;
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            background: #55FF55;
            transition: width 0.1s linear;
        }
        .progress-text {
            position: absolute;
            width: 100%;
            text-align: center;
            top: 2px;
            color: #FFFFFF;
            font-size: 14px;
            text-shadow: 1px 1px #000;
        }
        .button-group {
            display: flex;
            gap: 10px;
            width: 100%;
            max-width: 600px;
        }
        .mc-btn {
            flex: 1;
            height: 40px;
            background: #666666;
            border: 2px solid #000000;
            border-top-color: #888888;
            border-left-color: #888888;
            color: #E0E0E0;
            font-size: 16px;
            text-align: center;
            line-height: 36px;
            cursor: pointer;
            text-shadow: 2px 2px #000000;
            box-shadow: inset -2px -2px #333333;
        }
        .mc-btn:hover {
            background: #7a7a7a;
            color: #FFFFFF;
            border-top-color: #9c9c9c;
            border-left-color: #9c9c9c;
        }
        .mc-btn:active {
            border: 2px solid #000000;
            box-shadow: inset 2px 2px #333333;
            padding-top: 2px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Multiplayer Mod Selection</h1>
        <p>Select a mod or download all items to connect to the server.</p>
    </div>

    <div class="mod-list-container">
        <div class="mod-list" id="modContainer">
            <!-- Mods loaded dynamically via JavaScript -->
        </div>
    </div>

    <div class="footer">
        <div class="downloader-status-bar" id="progressBar">
            <div class="progress-fill" id="progressFill"></div>
            <div class="progress-text" id="progressText">Downloading...</div>
        </div>
        
        <div class="button-group">
            <div class="mc-btn" onclick="downloadAllMods()">Download All Mods</div>
            <div class="mc-btn" onclick="location.reload()">Refresh</div>
        </div>
    </div>

        // Populate the UI with mod elements
        function initModList() {
            const container = document.getElementById('modContainer');
            container.innerHTML = '';

            modData.forEach(mod => {
                const element = document.createElement('div');
                element.className = 'mod-item';
                element.onclick = () => downloadSingleMod(mod);

                element.innerHTML = `
                    <img class="mod-icon" src="${mod.icon}" alt="${mod.name}">
                    <div class="mod-info">
                        <div class="mod-title-row">
                            <span class="mod-name">${mod.name}</span>
